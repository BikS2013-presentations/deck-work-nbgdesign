<!DOCTYPE html>

<title>What a viewer can do with a delivered deck</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --color-paper: #FFFFFF; --color-ink: #003841; --color-muted: #595959; --color-accent: #00ADBF; --font-sans: Aptos, Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
.frame { max-width: 1760px; width: 100%; }
.eyebrow { font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: #007B85; margin-bottom: 0.5rem; }
h1 { font-size: 1.75rem; font-weight: 400; letter-spacing: -0.01em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
svg { width: 100%; height: auto; display: block; }
</style>

<body>
<div class="frame">
<p class="eyebrow">Tree · nbg-design · Diagram Design</p>
<h1>What a viewer can do with a delivered deck</h1>
<svg viewBox="0 0 1760 640" width="1760" height="640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nbg-tree-title nbg-tree-desc" font-family="Aptos, Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="nbg-tree-title">What a viewer can do with a delivered deck</title><desc id="nbg-tree-desc">Tree of the in-deck editor's capabilities: text editing and formatting, shapes and arrangement, structure and toolbars, the AI assistant, and the outputs — saved copy, PDF and discard.</desc><defs><marker id="nbg-tree-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#595959"/></marker><marker id="nbg-tree-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00ADBF"/></marker><marker id="nbg-tree-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0D90FF"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><line x1="880" y1="128" x2="880" y2="176" stroke="#595959" stroke-width="1.2"/><path d="M208,224 V184 Q208,176 216,176 H1544 Q1552,176 1552,184 V224" fill="none" stroke="#595959" stroke-width="1.2"/><line x1="544" y1="176" x2="544" y2="224" stroke="#595959" stroke-width="1.2"/><line x1="880" y1="176" x2="880" y2="224" stroke="#595959" stroke-width="1.2"/><line x1="1216" y1="176" x2="1216" y2="224" stroke="#595959" stroke-width="1.2"/><rect x="720" y="48" width="320" height="80" rx="6" fill="#FFFFFF"/><rect x="720" y="48" width="320" height="80" rx="6" fill="rgba(0,173,191,0.22)" stroke="#00ADBF" stroke-width="1"/><text x="880" y="90" fill="#003841" font-size="20" font-weight="600" text-anchor="middle">Right-click editor</text><text x="880" y="114" fill="#595959" font-size="16" font-weight="400" text-anchor="middle">in every delivered deck</text><rect x="56" y="224" width="304" height="188" rx="6" fill="#FFFFFF" stroke="#003841" stroke-width="1"/><text x="208" y="264" fill="#003841" font-size="20" font-weight="600" text-anchor="middle">Text</text><line x1="80" y1="280" x2="336" y2="280" stroke="rgba(0,56,65,0.12)" stroke-width="1"/><text x="208" y="308" fill="#595959" font-size="16" font-weight="400" text-anchor="middle">Double-click, type, Enter applies</text><text x="208" y="334" fill="#595959" font-size="16" font-weight="400" text-anchor="middle">B I U S · size · font · alignment</text><text x="208" y="360" fill="#595959" font-size="16" font-weight="400" text-anchor="middle">colour from the NBG palette only</text><rect x="392" y="224" width="304" height="188" rx="6" fill="#FFFFFF" stroke="#003841" stroke-width="1"/><text x="544" y="264" fill="#003841" font-size="20" font-weight="600" text-anchor="middle">Shapes & arrange</text><line x1="416" y1="280" x2="672" y2="280" stroke="rgba(0,56,65,0.12)" stroke-width="1"/><text x="544" y="308" fill="#595959" font-size="16" font-weight="400" text-anchor="middle">Resize, move, fill, border, radius</text><text x="544" y="334" fill="#595959" font-size="16" font-weight="400" text-anchor="middle">several at once: Shift+click / drag</text><text x="544" y="360" fill="#595959" font-size="16" font-weight="400" text-anchor="middle">order · align · distribute · group</text><text x="544" y="386" fill="#595959" font-size="16" font-weight="400" text-anchor="middle">Edit SVG: the parts of a drawing</text><rect x="728" y="224" width="304" height="188" rx="6" fill="#FFFFFF" stroke="#003841" stroke-width="1"/><text x="880" y="264" fill="#003841" font-size="20" font-weight="600" text-anchor="middle">Structure & toolbars</text><line x1="752" y1="280" x2="1008" y2="280" stroke="rgba(0,56,65,0.12)" stroke-width="1"/><text x="880" y="308" fill="#595959" font-size="16" font-weight="400" text-anchor="middle">Outline and Tree tabs, checkboxes</text><text x="880" y="334" fill="#595959" font-size="16" font-weight="400" text-anchor="middle">element source under a splitter</text><text x="880" y="360" fill="#595959" font-size="16" font-weight="400" text-anchor="middle">toolbars pin, anchor, detach</text><rect x="1064" y="224" width="304" height="188" rx="6" fill="#FFFFFF" stroke="#003841" stroke-width="1"/><text x="1216" y="264" fill="#003841" font-size="20" font-weight="600" text-anchor="middle">Assistant</text><line x1="1088" y1="280" x2="1344" y2="280" stroke="rgba(0,56,65,0.12)" stroke-width="1"/><text x="1216" y="308" fill="#595959" font-size="16" font-weight="400" text-anchor="middle">prompt · screenshot · source · clip</text><text x="1216" y="334" fill="#595959" font-size="16" font-weight="400" text-anchor="middle">answer, or replace the element</text><text x="1216" y="360" fill="#595959" font-size="16" font-weight="400" text-anchor="middle">your own endpoint and key</text><rect x="1400" y="224" width="304" height="188" rx="6" fill="#FFFFFF" stroke="#003841" stroke-width="1"/><text x="1552" y="264" fill="#003841" font-size="20" font-weight="600" text-anchor="middle">Output</text><line x1="1424" y1="280" x2="1680" y2="280" stroke="rgba(0,56,65,0.12)" stroke-width="1"/><text x="1552" y="308" fill="#595959" font-size="16" font-weight="400" text-anchor="middle">Save edited copy: still one file</text><text x="1552" y="334" fill="#595959" font-size="16" font-weight="400" text-anchor="middle">Export to PDF, one page per slide</text><text x="1552" y="360" fill="#595959" font-size="16" font-weight="400" text-anchor="middle">discard this slide, or every edit</text><text x="1552" y="386" fill="#595959" font-size="16" font-weight="400" text-anchor="middle">rebuild.mjs: newer tools, later</text><text x="880" y="460" fill="#595959" font-size="20" font-weight="400" text-anchor="middle" font-style="italic">Fonts and colours stay inside the NBG-inspired look: a viewer can fix a slide, not leave the system.</text><text x="880" y="492" fill="#939793" font-size="20" font-weight="400" text-anchor="middle" font-style="italic">Images, new elements and new layouts remain the skill's job — regenerate.</text><line x1="40" y1="556" x2="1720" y2="556" stroke="rgba(0,56,65,0.1)" stroke-width="0.8"/><text x="40" y="580" fill="#595959" font-size="12" font-weight="400" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="160" y="592" width="20" height="14" rx="2" fill="rgba(0,173,191,0.22)" stroke="#00ADBF" stroke-width="1"/><text x="200" y="605" fill="#595959" font-size="14" font-weight="400" text-anchor="start">The editor itself</text><rect x="400" y="592" width="20" height="14" rx="2" fill="#FFFFFF" stroke="#003841" stroke-width="1"/><text x="440" y="605" fill="#595959" font-size="14" font-weight="400" text-anchor="start">A family of actions, all recorded and reversible</text></svg>
